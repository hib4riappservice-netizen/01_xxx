# DEV-02 (MUST): main へのPRとpushで、1つでも赤ならマージしない。
# SEC-10: pnpm install --frozen-lockfile。SEC-92 相当: Actions はコミットSHAでピン留め。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SEC-92 相当 (MUST): permissions を最小化
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # check:diff-size が merge-base を求めるため、shallow clone だと
          # 共通の祖先が見つからず落ちる（実測で発見）。全履歴を取得する
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # SEC-13: critical/high の未対応を残さない
      - run: pnpm audit --audit-level=high
      # SEC-11: 「設定したつもり」ではなく解決値を確認する
      - run: pnpm check:release-age
      # DoD G0 / checklists/feature.md: 生成コード・lockfileを除く差分400行以内（例外なし）
      - if: github.event_name == 'pull_request'
        run: pnpm check:diff-size origin/${{ github.base_ref }}

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
